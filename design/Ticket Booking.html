<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Reel Room — Ticket Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --bg: oklch(0.14 0.008 60);
    --bg-soft: oklch(0.17 0.008 60);
    --card: oklch(0.16 0.008 60);
    --fg: oklch(0.96 0.005 60);
    --fg-soft: oklch(0.78 0.008 60);
    --fg-faint: oklch(0.55 0.008 60);
    --line: oklch(0.28 0.008 60);
    --seat-line: oklch(0.40 0.008 60);
    --seat-locked: oklch(0.30 0.008 60);
    --accent: oklch(0.78 0.14 75);
  }

  body[data-theme="light"] {
    --bg: oklch(0.985 0.005 75);
    --bg-soft: oklch(0.96 0.005 75);
    --card: oklch(0.98 0.005 75);
    --fg: oklch(0.20 0.008 75);
    --fg-soft: oklch(0.40 0.008 75);
    --fg-faint: oklch(0.60 0.008 75);
    --line: oklch(0.86 0.008 75);
    --seat-line: oklch(0.78 0.008 75);
    --seat-locked: oklch(0.85 0.008 75);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  ::selection {
    background: var(--accent);
    color: var(--bg);
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
  }
  @keyframes seatPulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.2); box-shadow: 0 0 0 0 var(--accent); }
    100% { transform: scale(1); box-shadow: 0 0 0 8px transparent; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .screen-enter { animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>

</head>
<body data-theme="dark">

<div id="root"></div>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="screen-browse.jsx"></script>
<script type="text/babel" src="screen-detail.jsx"></script>
<script type="text/babel" src="screen-seats.jsx"></script>
<script type="text/babel" src="screen-checkout.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "dark",
    "accent": "amber",
    "density": "cozy",
    "liveLockSim": true
  }/*EDITMODE-END*/;

  const ACCENTS = {
    amber: 'oklch(0.78 0.14 75)',
    crimson: 'oklch(0.68 0.16 25)',
    emerald: 'oklch(0.72 0.14 160)',
    violet: 'oklch(0.70 0.18 300)',
    cyan: 'oklch(0.78 0.12 220)',
  };

  const App = () => {
    const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const [route, setRoute] = React.useState({ name: 'browse' });
    const [now, setNow] = React.useState(() => fmtNow());

    React.useEffect(() => {
      document.body.dataset.theme = tweaks.theme;
      document.documentElement.style.setProperty('--accent', ACCENTS[tweaks.accent] ?? ACCENTS.amber);
    }, [tweaks.theme, tweaks.accent]);

    React.useEffect(() => {
      const i = setInterval(() => setNow(fmtNow()), 30000);
      return () => clearInterval(i);
    }, []);

    function fmtNow() {
      const d = new Date();
      return `MUMBAI · ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} IST`;
    }

    const go = (r) => {
      setRoute(r);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    return (
      <>
        <Marquee now={now} />

        {/* Top nav */}
        <header
          className="flex items-center justify-between px-6 py-5"
          style={{ borderBottom: '1px solid var(--line)' }}
        >
          <button
            onClick={() => go({ name: 'browse' })}
            className="flex items-baseline gap-3"
            style={{ background: 'transparent', border: 'none', cursor: 'pointer', padding: 0 }}
          >
            <span
              style={{
                fontFamily: '"Playfair Display", serif',
                fontStyle: 'italic',
                fontWeight: 700,
                fontSize: 26,
                color: 'var(--fg)',
                letterSpacing: '-0.02em',
              }}
            >
              Reel Room
            </span>
            <Mono className="text-[10px] uppercase tracking-[0.3em]" style={{ color: 'var(--fg-faint)' }}>
              est. 2026
            </Mono>
          </button>

          <nav className="flex items-center gap-1">
            {['Films', 'Theaters', 'Bookings', 'Account'].map((n, i) => (
              <button
                key={n}
                style={{
                  padding: '8px 14px',
                  background: 'transparent',
                  border: 'none',
                  color: i === 0 ? 'var(--fg)' : 'var(--fg-soft)',
                  fontFamily: 'JetBrains Mono, monospace',
                  fontSize: 11,
                  letterSpacing: '0.15em',
                  textTransform: 'uppercase',
                  cursor: 'pointer',
                  borderBottom: i === 0 ? '1px solid var(--accent)' : '1px solid transparent',
                }}
              >
                {n}
              </button>
            ))}
          </nav>

          <div
            style={{
              padding: '8px 14px',
              border: '1px solid var(--line)',
              borderRadius: 2,
              fontFamily: 'JetBrains Mono, monospace',
              fontSize: 11,
              color: 'var(--fg-soft)',
              letterSpacing: '0.1em',
            }}
          >
            ⌘K Search
          </div>
        </header>

        <main className="px-6 pb-20 pt-12 mx-auto" style={{ maxWidth: 1280 }}>
          <div key={route.name + (route.id ?? '')} className="screen-enter">
            {route.name === 'browse' && (
              <BrowseScreen
                tweaks={tweaks}
                onPick={(id) => go({ name: 'detail', id })}
              />
            )}
            {route.name === 'detail' && (
              <MovieDetailScreen
                movieId={route.id}
                onBack={() => go({ name: 'browse' })}
                onPickShowtime={(s) => go({ name: 'seats', showtime: s })}
              />
            )}
            {route.name === 'seats' && (
              <SeatScreen
                showtime={route.showtime}
                tweaks={tweaks}
                onBack={() => go({ name: 'detail', id: route.showtime.movie.id })}
                onCheckout={(o) => go({ name: 'payment', order: o })}
              />
            )}
            {route.name === 'payment' && (
              <PaymentScreen
                order={route.order}
                onBack={() => go({ name: 'seats', showtime: route.order.showtime })}
                onConfirm={(b) => go({ name: 'confirm', booking: b })}
              />
            )}
            {route.name === 'confirm' && (
              <ConfirmationScreen
                booking={route.booking}
                onDone={() => go({ name: 'browse' })}
              />
            )}
          </div>
        </main>

        <footer
          className="px-6 py-8 mt-12"
          style={{ borderTop: '1px solid var(--line)' }}
        >
          <div className="mx-auto flex items-center justify-between" style={{ maxWidth: 1280 }}>
            <Mono className="text-[10px] uppercase tracking-[0.3em]" style={{ color: 'var(--fg-faint)' }}>
              Reel Room · A scalable booking platform
            </Mono>
            <Mono className="text-[10px] uppercase tracking-[0.3em]" style={{ color: 'var(--fg-faint)' }}>
              Saga · Redlock · Socket.io
            </Mono>
          </div>
        </footer>

        <TweaksPanel title="Tweaks">
          <TweakSection title="Theme">
            <TweakRadio
              label="Mode"
              value={tweaks.theme}
              onChange={(v) => setTweak('theme', v)}
              options={[
                { value: 'dark', label: 'Dark' },
                { value: 'light', label: 'Light' },
              ]}
            />
            <TweakSelect
              label="Accent"
              value={tweaks.accent}
              onChange={(v) => setTweak('accent', v)}
              options={[
                { value: 'amber', label: 'Marquee Amber' },
                { value: 'crimson', label: 'Crimson Curtain' },
                { value: 'emerald', label: 'Emerald Velvet' },
                { value: 'violet', label: 'Violet Reel' },
                { value: 'cyan', label: 'Cyan Projector' },
              ]}
            />
          </TweakSection>
          <TweakSection title="Density">
            <TweakRadio
              label="Seat map"
              value={tweaks.density}
              onChange={(v) => setTweak('density', v)}
              options={[
                { value: 'cozy', label: 'Cozy' },
                { value: 'compact', label: 'Compact' },
              ]}
            />
          </TweakSection>
          <TweakSection title="Demo">
            <TweakToggle
              label="Live lock simulation"
              value={tweaks.liveLockSim}
              onChange={(v) => setTweak('liveLockSim', v)}
            />
          </TweakSection>
        </TweaksPanel>
      </>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
